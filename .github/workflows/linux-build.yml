name: Linux Desktop Build

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'packaging/arch/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/arch/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

jobs:
  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel git jdk17-openjdk
      - uses: actions/checkout@v4
      - name: Configure Java
        shell: bash
        run: |
          java_home=/usr/lib/jvm/java-17-openjdk
          test -x "$java_home/bin/java"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version
      - name: Build Arch Linux package
        run: |
          chmod +x gradlew
          cd packaging/arch
          makepkg --noconfirm --cleanbuild --asroot
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-archlinux-x86_64
          path: packaging/arch/rikkahub-*.pkg.tar.*
