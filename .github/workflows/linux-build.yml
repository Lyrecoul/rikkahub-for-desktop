name: Linux Desktop Build

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'packaging/arch/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/arch/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

jobs:
  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git jdk17-openjdk
      - uses: actions/checkout@v4
      - name: Build desktop distribution
        run: ./gradlew -PdesktopOnly :desktop:createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-archlinux-x86_64
          path: desktop/build/compose/binaries/main/app/rikkahub/
